<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>No Internet Connection - PK ARENA</title>
  <style type="text/css"> 
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root { 
      --bg-dark: #08080a;
      --card-bg: rgba(21, 21, 24, 0.95);
      --card-border: rgba(234, 179, 8, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --gold-primary: #eab308;
      --gold-light: #facc15;
      --gold-dark: #ca8a04;
      --gold-glow: rgba(234, 179, 8, 0.35);
    }
    
    html, body { 
      background-color: var(--bg-dark) !important; 
      color: var(--text-main);
      width: 100%;
      height: 100vh;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    } 

    /* Ambient Gold Glows */
    .glow-top {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .glow-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.12) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.9; }
    }
    
    .container { 
      position: relative;
      z-index: 10;
      text-align: center; 
      padding: 36px 28px;
      background: linear-gradient(180deg, #18181c 0%, #0d0d10 100%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 88%;
      max-width: 360px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(234, 179, 8, 0.15);
      animation: enterCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    } 

    @keyframes enterCard {
      from { opacity: 0; transform: translateY(25px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Badge */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 9999px;
      margin-bottom: 22px;
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
    }

    .brand-text {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    /* Icon Box */
    .icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.15) 0%, rgba(234, 179, 8, 0.02) 100%);
      border: 1.5px solid rgba(234, 179, 8, 0.4);
      border-radius: 24px;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.2);
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      stroke: var(--gold-light);
      filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.5));
    }
    
    h1 {
      color: #ffffff;
      font-weight: 900;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .gold-line {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      margin: 0 auto 14px auto;
    }

    p {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 26px;
      font-weight: 400;
    }
    
    /* Button */
    button { 
      position: relative;
      width: 100%;
      background: linear-gradient(90deg, #f59e0b 0%, #eab308 50%, #f59e0b 100%);
      color: #000000;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 15px 24px; 
      border: 1px solid rgba(254, 240, 138, 0.6);
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.35);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(0, 0, 0, 0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-center"></div>

  <div class="container">
    <!-- Brand Badge -->
    <div class="brand-badge">
      <span class="brand-dot"></span>
      <span class="brand-text">PK ARENA ESPORTS</span>
    </div>

    <!-- Offline Icon -->
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 15.038a5.25 5.25 0 0 1 7.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 0 1 1.06 0" />
      </svg>
    </div>

    <!-- Text -->
    <h1>NO CONNECTION</h1>
    <div class="gold-line"></div>
    <p id="descText">Internet connection lost.<br/>Please check your Wi-Fi / Data and try again.</p>

    <!-- Retry Button -->
    <button id="retryButton" type="button" onclick="handleRetry()">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">TRY AGAIN</span>
    </button>
  </div>

  <script>
    function handleRetry() {
      var btn = document.getElementById('retryButton');
      var spinner = document.getElementById('btnSpinner');
      var btnText = document.getElementById('btnText');
      
      spinner.style.display = 'inline-block';
      btnText.innerText = 'RECONNECTING...';
      btn.style.opacity = '0.85';

      setTimeout(function() {
        // Median / GoNative official reload bridge
        if (window.gonative && window.gonative.webview && typeof window.gonative.webview.reload === 'function') {
          window.gonative.webview.reload();
        } else if (window.median && window.median.webview && typeof window.median.webview.reload === 'function') {
          window.median.webview.reload();
        } else {
          window.location.reload();
        }
      }, 400);
    }

    // Auto-reload as soon as device gets internet back
    window.addEventListener('online', function() {
      handleRetry();
    });
  </script>
</body>
</html>
