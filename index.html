    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        function isAdminMode() {
          try {
            if (window.__IS_ADMIN_USER__ === true) return true;
            var path = (window.location.pathname || '').toLowerCase();
            if (path.indexOf('/admin') !== -1 || path.indexOf('/owner') !== -1) return true;
            if (sessionStorage.getItem('admin_authenticated') === 'true' || localStorage.getItem('pk_is_admin') === 'true') return true;
            var role = localStorage.getItem('pk_user_role') || sessionStorage.getItem('pk_user_role');
            if (role === 'admin' || role === 'owner') return true;
          } catch (err) {}
          return false;
        }

        // Master shortcut, inspect & right-click blocker (Enabled for Admin, Blocked for regular users)
        function blockDevShortcuts(e) {
          if (isAdminMode()) {
            return; // Allow all shortcuts & dev tools in Admin
          }
          // F12
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools / Console / Elements)
          if ((e.ctrlKey || e.metaKey) && e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+U (View Source), Ctrl+S (Save), Ctrl+P (Print)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 80)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        function blockContextMenu(e) {
          if (isAdminMode()) {
            return; // Allow right click / inspect in Admin
          }
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        function blockDrag(e) {
          if (isAdminMode()) {
            return;
          }
          e.preventDefault();
          return false;
        }

        window.addEventListener('keydown', blockDevShortcuts, true);
        document.addEventListener('keydown', blockDevShortcuts, true);
        window.addEventListener('contextmenu', blockContextMenu, true);
        document.addEventListener('contextmenu', blockContextMenu, true);
        document.addEventListener('dragstart', blockDrag, true);
      })();
    </script>
