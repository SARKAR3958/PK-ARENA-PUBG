<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        // Master shortcut, inspect & right-click blocker
        function blockDevShortcuts(e) {
          // F12
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools / Console / Elements)
          if ((e.ctrlKey || e.metaKey) && e.shiftKey) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+U (View Source), Ctrl+S (Save), Ctrl+P (Print)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 80)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        window.addEventListener('keydown', blockDevShortcuts, true);
        document.addEventListener('keydown', blockDevShortcuts, true);
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
        document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
      })();
    </script>
    <meta name="google" content="notranslate" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <link rel="icon" type="image/jpeg" href="/PK-LOGO.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>PK ARENA PUBG</title>
  </head>
  <body oncontextmenu="return false;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
